name: CI

on:
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs so force-pushes / rapid commits do not stack full OS matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-task: package:linux
          - os: windows-latest
            package-task: package:windows
          - os: macos-latest
            package-task: package:macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          # Yarn 4 via packageManager+corepack: setup-node cache:yarn invokes global Yarn 1 and fails.
          # Keep package-manager-cache off; Go cache + setup-task still cut measured setup time.
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Install locked dependencies
        run: task install
      - name: Compile and test
        run: task check
      - name: Package application
        run: task ${{ matrix.package-task }}
      - name: Smoke packaged application
        if: runner.os != 'Linux'
        run: task smoke:package
      - name: Smoke packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a task smoke:package
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: task audit

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
