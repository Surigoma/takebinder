name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-task: package:linux
          - os: windows-latest
            package-task: package:windows
          - os: macos-latest
            package-task: package:macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install pinned Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      - name: Install locked dependencies
        run: task install
      - name: Compile and test
        run: task check
      - name: Package application
        run: task ${{ matrix.package-task }}
      - name: Smoke packaged application
        if: runner.os != 'Linux'
        run: task smoke:package
      - name: Smoke packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a task smoke:package
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: task audit

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
