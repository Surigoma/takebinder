name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0

  build:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-task: package:linux
            artifact-name: linux
          - os: windows-latest
            package-task: package:windows
            artifact-name: windows
          - os: macos-latest
            package-task: package:macos
            artifact-name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install pinned Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      - name: Install locked dependencies
        run: task install
      - name: Compile and test
        run: task check
      - name: Package application
        run: task ${{ matrix.package-task }}
      - name: Smoke packaged application
        if: runner.os != 'Linux'
        run: task smoke:package
      - name: Smoke packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a task smoke:package
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: task audit
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "release/TakeBinder-win32-x64" -DestinationPath "release/TakeBinder-${{ needs.release_please.outputs.tag_name }}-windows-x64.zip"
      - name: Archive macOS application
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          arch="$(node -p 'process.arch')"
          ditto -c -k --sequesterRsrc --keepParent "release/TakeBinder.app" "release/TakeBinder-${RELEASE_TAG}-macos-${arch}.zip"
      - name: Archive Linux application
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          arch="$(node -p 'process.arch')"
          tar -C release -czf "release/TakeBinder-${RELEASE_TAG}-linux-${arch}.tar.gz" "TakeBinder-linux-${arch}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.artifact-name }}
          path: |
            release/TakeBinder-v*.zip
            release/TakeBinder-v*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish_assets:
    needs: [release_please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum TakeBinder-* | sort -k2 > SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
